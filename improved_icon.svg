<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 火焰光芒渐变 -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="45%" stop-color="#f57c00"/>
      <stop offset="85%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>

    <!-- 暖红酒香内核渐变 -->
    <radialGradient id="darkRedCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0817"/>
      <stop offset="50%" stop-color="#32040e"/>
      <stop offset="85%" stop-color="#200208"/>
      <stop offset="100%" stop-color="#140105"/>
    </radialGradient>

    <!-- 金圈渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- 彩虹八角星渐变 -->
    <linearGradient id="starRainbowVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aeea00"/>
      <stop offset="25%" stop-color="#00e676"/>
      <stop offset="55%" stop-color="#00e5ff"/>
      <stop offset="80%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>

    <!-- 星星发光滤镜 -->
    <filter id="starGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 24舌 S型火焰群定义 -->
    <g id="flameGroup">
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(15 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(30 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(45 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(60 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(75 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(90 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(105 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(120 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(135 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(150 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(165 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(180 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(195 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(210 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(225 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(240 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(255 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(270 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(285 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(300 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(315 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(330 50 50)"/>
      <path d="M47.5,35 C43.5,23 41,12 48.5,1.5 C53.5,12 55.5,23 52.5,35 Z" fill="url(#flameGrad)" stroke="#ff6d00" stroke-width="0.35" transform="rotate(345 50 50)"/>
    </g>
  </defs>

  <!-- 1. 24 舌火焰群体 -->
  <use href="#flameGroup"/>

  <!-- 2. 金色双层边缘与暗红内核 -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="34.5" fill="url(#darkRedCore)" stroke="#ffb300" stroke-width="0.6"/>

  <!-- 3. 内核精致虚线轨道环 -->
  <circle cx="50" cy="50" r="31" fill="none" stroke="#ffca28" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.85"/>

  <!-- 4. 金色优雅弧线轨道 -->
  <g opacity="0.75" stroke="url(#goldGrad)" stroke-width="0.6" fill="none">
    <path d="M26,42 C34,22 66,22 74,42"/>
    <path d="M26,58 C34,78 66,78 74,58"/>
    <path d="M42,26 C22,34 22,66 42,74"/>
    <path d="M58,26 C78,34 78,66 58,74"/>
    <path d="M30,45 C38,30 62,30 70,45" stroke-width="0.4"/>
    <path d="M30,55 C38,70 62,70 70,55" stroke-width="0.4"/>
    <path d="M45,30 C30,38 30,62 45,70" stroke-width="0.4"/>
    <path d="M55,30 C70,38 70,62 55,70" stroke-width="0.4"/>
  </g>

  <!-- 5. 核心 8 角彩虹闪耀星 -->
  <g filter="url(#starGlowFilter)">
    <path d="M50,18 
             L52.8,46 L62,38 L54,47.2 
             L82,50 
             L54,52.8 L62,62 L52.8,54 
             L50,82 
             L47.2,54 L38,62 L46,52.8 
             L18,50 
             L46,47.2 L38,38 L47.2,46 Z" 
          fill="url(#starRainbowVert)" stroke="#ffffff" stroke-width="0.35"/>
    <circle cx="50" cy="50" r="2.5" fill="#ffffff"/>
  </g>
</svg>
