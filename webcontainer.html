<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebContainer OS Sandbox</title>
    <!-- Critical for SharedArrayBuffer -->
    <script src="coi-serviceworker.js"></script>
    <!-- Xterm CSS -->
    <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.320.0/font/lucide.min.css" rel="stylesheet">
    <style>
        /* Modern dark theme with glassmorphism */
        body { margin: 0; padding: 0; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow: hidden; }
        .sidebar { width: 350px; display: flex; flex-direction: column; background: rgba(30, 41, 59, 0.8); border-right: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .header { height: 50px; display: flex; align-items: center; padding: 0 20px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-weight: 600; font-size: 14px; gap: 10px; }
        .header-icon { color: #38bdf8; }
        .terminal-container { flex: 1; padding: 10px; overflow: hidden; }
        .preview-container { flex: 1; display: flex; flex-direction: column; background: #1e293b; }
        .preview-header { height: 40px; display: flex; align-items: center; padding: 0 15px; background: #0f172a; font-size: 12px; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .url-bar { flex: 1; background: #1e293b; padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-family: monospace; display: flex; align-items: center; }
        .preview-iframe { flex: 1; width: 100%; border: none; background: #fff; }
        .badge { padding: 2px 6px; border-radius: 4px; background: rgba(56, 189, 248, 0.2); color: #38bdf8; font-size: 11px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .btn:hover { background: #7dd3fc; }
        .loading-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top-color: #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Xterm overrides */
        .xterm-viewport { background-color: transparent !important; }
        .xterm { padding: 10px; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">🚀 Booting WebContainer OS...</div>
        <div style="font-size: 13px; color: #94a3b8;" id="loading-text">Downloading WebAssembly core (this may take a few seconds on first run)...</div>
    </div>

    <div class="sidebar">
        <div class="header">
            <i class="lucide-terminal header-icon"></i>
            <span>System Terminal</span>
            <div style="flex: 1"></div>
            <span class="badge">Root</span>
        </div>
        <div class="terminal-container" id="terminal-container"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <i class="lucide-monitor header-icon"></i>
            <span>Live Preview</span>
            <div style="flex: 1"></div>
            <button class="btn" id="reload-btn">Reload</button>
            <button class="btn" id="open-external-btn" style="background: rgba(255,255,255,0.1); color: #f8fafc;">External</button>
        </div>
        <div class="preview-container">
            <div class="preview-header">
                <i class="lucide-lock" style="color: #4ade80;"></i>
                <div class="url-bar" id="url-bar">Waiting for local server to start...</div>
            </div>
            <iframe class="preview-iframe" id="preview-iframe" allow="cross-origin-isolated"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script type="module" src="webcontainer-app.js"></script>
</body>
</html>
