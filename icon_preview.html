<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全新火焰彩虹八角星 SVG 图标预览</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body.light-theme {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 800px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff2a55, #ffd600, #00e676, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 868px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .icon-stage {
      width: 100%;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(255, 87, 34, 0.08) 0%, transparent 70%);
      border-radius: 12px;
      position: relative;
    }

    .icon-wrapper {
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 15px 30px rgba(255, 109, 0, 0.3));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-wrapper:hover {
      transform: scale(1.08) rotate(3deg);
    }

    .sizes-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-top: 1.5rem;
    }

    .size-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .size-box span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .code-card {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .code-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      background: #ff2a55;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    pre {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      overflow-x: auto;
      font-family: "Fira Code", Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #e2e8f0;
      max-height: 380px;
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>全新火焰波浪彩虹八角星图标</h1>
    <p class="subtitle">根据最新示例图片全重构：24 舌 S 型波浪太阳火焰、深红酒香内核、金色优雅椭圆弧线轨道与八角渐变彩虹星芒。</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="preview-header">
        <span class="card-title">🎨 实时效果预览</span>
        <button class="theme-toggle" onclick="document.body.classList.toggle('light-theme')">🌓 切换背景色</button>
      </div>

      <div class="icon-stage">
        <div class="icon-wrapper" id="svgContainer"></div>
      </div>

      <div class="sizes-bar">
        <div class="size-box">
          <div style="width: 64px; height: 64px;" class="mini-svg"></div>
          <span>64px</span>
        </div>
        <div class="size-box">
          <div style="width: 48px; height: 48px;" class="mini-svg"></div>
          <span>48px</span>
        </div>
        <div class="size-box">
          <div style="width: 32px; height: 32px;" class="mini-svg"></div>
          <span>32px</span>
        </div>
      </div>
    </div>

    <div class="card code-card">
      <div class="preview-header">
        <span class="card-title">⚡ SVG 源码</span>
        <div class="code-actions">
          <button class="btn btn-secondary" onclick="downloadSVG()">💾 下载 .svg</button>
          <button class="btn" onclick="copyCode()">📋 复制代码</button>
        </div>
      </div>
      <pre><code id="codeBlock">加载中...</code></pre>
    </div>
  </div>

  <script>
    let rawSVG = '';

    fetch('improved_icon.svg')
      .then(res => res.text())
      .then(data => {
        rawSVG = data;
        document.getElementById('svgContainer').innerHTML = data;
        document.getElementById('codeBlock').innerText = data;
        document.querySelectorAll('.mini-svg').forEach(el => el.innerHTML = data);
      });

    function copyCode() {
      navigator.clipboard.writeText(rawSVG).then(() => alert('SVG 代码已复制到剪贴板！'));
    }

    function downloadSVG() {
      const blob = new Blob([rawSVG], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'flame_rainbow_star_icon.svg';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
