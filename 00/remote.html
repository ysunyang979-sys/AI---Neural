<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Core - P2P Portal</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; color: transparent; }
        .status { text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; background: #1e293b; margin-bottom: 20px; transition: all 0.3s; }
        .status.connected { background: #166534; color: #4ade80; box-shadow: 0 0 15px rgba(74, 222, 128, 0.2); }
        textarea { flex: 1; width: 100%; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: white; padding: 15px; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 15px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        textarea:focus { outline: none; border-color: #3b82f6; }
        .btn { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.98); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }
        .btn:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
        svg { width: 24px; height: 24px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NEURAL CORE PORTAL</h1>
    </div>
    <div id="status" class="status">正在寻找时空隧道...</div>
    
    <textarea id="msgInput" placeholder="在此输入要发送给 AI 的文字，点击发送即可瞬间同步到电脑端..."></textarea>
    
    <button id="sendBtn" class="btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        发送穿透数据
    </button>

    <script>
        const statusEl = document.getElementById('status');
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('msgInput');
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('peer');
        
        if (!targetPeerId) {
            statusEl.innerText = "错误：未发现目标ID。请重新扫描电脑端的二维码。";
            statusEl.style.color = "#ef4444";
        } else {
            const peer = new Peer();
            let conn = null;
            
            peer.on('open', (id) => {
                statusEl.innerText = "正在打通 P2P 隧道...";
                conn = peer.connect(targetPeerId, { reliable: true });
                
                conn.on('open', () => {
                    statusEl.innerText = "✨ 隧道已打通！极速直连。";
                    statusEl.classList.add('connected');
                    sendBtn.disabled = false;
                });
                
                conn.on('close', () => {
                    statusEl.innerText = "连接已断开，请刷新电脑页面重新扫码。";
                    statusEl.classList.remove('connected');
                    sendBtn.disabled = true;
                });
            });
            
            peer.on('error', (err) => {
                statusEl.innerText = "连接故障: " + err.type;
                statusEl.style.color = "#ef4444";
            });
            
            sendBtn.addEventListener('click', () => {
                const text = msgInput.value.trim();
                if (conn && conn.open && text) {
                    conn.send({ type: 'text', content: text });
                    msgInput.value = '';
                    
                    const originalHTML = sendBtn.innerHTML;
                    sendBtn.innerHTML = "✅ 发送成功！";
                    sendBtn.style.background = "#10b981";
                    
                    setTimeout(() => {
                        sendBtn.innerHTML = originalHTML;
                        sendBtn.style.background = "#3b82f6";
                    }, 1000);
                }
            });
        }
    </script>
</body>
</html>
